{% extends "base.html" %}

{% block title %}Volunteer Delivery Map — Khidmat.net{% endblock %}

{% block content %}

<div class="volunteer-wrap">

    <div class="volunteer-card">

        <p class="eyebrow">DELIVERY VOLUNTEER</p>

        <h1>🚴 Delivery Map</h1>

        <p class="page-description">
            Use your current location while delivering a donation.
        </p>


        <!--
            Hidden form containing Django's CSRF token.

            JavaScript will read this token and send it
            with the location request.
        -->

        <form style="display: none;">
            {% csrf_token %}
        </form>


        <button
            type="button"
            id="start-location"
            class="btn primary"
        >
            📍 Start My Location
        </button>


        <div id="location-status" class="location-status">
            Location tracking has not started.
        </div>


        <div id="volunteer-map"></div>

    </div>

</div>


<!-- MapLibre CSS -->

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
>


<style>

.volunteer-wrap {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
}


.volunteer-card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}


.page-description {
    color: #66736b;
    margin-bottom: 20px;
}


.location-status {
    margin-top: 15px;
    margin-bottom: 15px;
    padding: 12px 15px;
    border-radius: 10px;
    background: #f1f3f5;
    color: #444;
}


#volunteer-map {
    width: 100%;
    height: 500px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #e4e8e3;
}


@media (max-width: 768px) {

    .volunteer-card {
        padding: 20px;
    }

    #volunteer-map {
        height: 400px;
    }

}

</style>


<!-- MapLibre JavaScript -->

<script type="module">

import * as maplibregl from
    "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";


/*
 * Default map position
 *
 * Karachi is only used as the initial
 * map position before GPS is found.
 */

const defaultLongitude = 67.0011;
const defaultLatitude = 24.8607;


/*
 * Create map
 */

const map = new maplibregl.Map({

    container: "volunteer-map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center: [
        defaultLongitude,
        defaultLatitude
    ],

    zoom: 11

});


/*
 * Navigation controls
 */

map.addControl(
    new maplibregl.NavigationControl(),
    "top-right"
);


/*
 * Volunteer marker
 */

let volunteerMarker = null;


/*
 * Browser location watcher
 */

let watchId = null;


/*
 * Status element
 */

const status =
    document.getElementById(
        "location-status"
    );


/*
 * Get Django CSRF token
 */

const csrfToken =
    document.querySelector(
        "[name=csrfmiddlewaretoken]"
    ).value;


/*
 * Start location tracking
 */

document
    .getElementById("start-location")
    .addEventListener("click", function () {


        /*
         * Check browser support
         */

        if (!navigator.geolocation) {

            status.innerText =
                "❌ Your browser does not support location.";

            return;

        }


        /*
         * Prevent starting multiple watchers
         */

        if (watchId !== null) {

            status.innerText =
                "📡 Location tracking is already running.";

            return;

        }


        status.innerText =
            "📡 Starting location tracking...";


        /*
         * Start watching GPS
         */

        watchId =
            navigator.geolocation.watchPosition(

                function(position) {


                    /*
                     * Get coordinates
                     */

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    /*
                     * Update status
                     */

                    status.innerText =
                        "🟢 Live location: " +
                        latitude.toFixed(6) +
                        ", " +
                        longitude.toFixed(6);


                    /*
                     * Send location to Django
                     */

                    const formData =
                        new FormData();


                    formData.append(
                        "latitude",
                        latitude
                    );


                    formData.append(
                        "longitude",
                        longitude
                    );


                    fetch(
                        "{% url 'update_volunteer_location' %}",
                        {
                            method: "POST",

                            headers: {
                                "X-CSRFToken":
                                    csrfToken
                            },

                            body: formData
                        }
                    )

                    .then(function(response) {

                        if (!response.ok) {

                            throw new Error(
                                "Server returned HTTP " +
                                response.status
                            );

                        }

                        return response.json();

                    })

                    .then(function(data) {

                        if (data.success) {

                            console.log(
                                "Volunteer location saved:",
                                data.latitude,
                                data.longitude
                            );

                        }

                        else {

                            console.error(
                                "Location update failed:",
                                data.message
                            );

                        }

                    })

                    .catch(function(error) {

                        console.error(
                            "Location request error:",
                            error
                        );

                    });


                    /*
                     * If marker doesn't exist,
                     * create it.
                     */

                    if (!volunteerMarker) {

                        volunteerMarker =
                            new maplibregl.Marker({
                                color: "#2563eb"
                            })

                            .setLngLat([
                                longitude,
                                latitude
                            ])

                            .setPopup(
                                new maplibregl.Popup()
                                .setHTML(
                                    "<strong>🚴 You</strong><br>" +
                                    "Delivery Volunteer"
                                )
                            )

                            .addTo(map);

                    }

                    else {

                        /*
                         * Move existing marker
                         */

                        volunteerMarker
                            .setLngLat([
                                longitude,
                                latitude
                            ]);

                    }


                    /*
                     * Move map to volunteer
                     */

                    map.flyTo({

                        center: [
                            longitude,
                            latitude
                        ],

                        zoom: 16,

                        duration: 1000

                    });

                },


                function(error) {


                    console.error(error);


                    if (error.code === 1) {

                        status.innerText =
                            "❌ Location permission was denied.";

                    }

                    else if (error.code === 2) {

                        status.innerText =
                            "❌ Your location could not be determined.";

                    }

                    else if (error.code === 3) {

                        status.innerText =
                            "❌ Location request timed out.";

                    }

                    else {

                        status.innerText =
                            "❌ Unable to get your location.";

                    }

                },


                {

                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 0

                }

            );

    });

</script>

{% endblock %}
