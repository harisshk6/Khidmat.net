{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khidmat.net - Delivery Map</title>

    <!-- MapLibre CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
        }

        .page {
            min-height: 100vh;
        }

        /* Header */
        .map-header {
            background: #198754;
            color: white;
            padding: 18px 25px;
        }

        .map-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .map-header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Main content */
        .map-container {
            padding: 20px;
        }

        .map-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        /* Map */
        #map {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .location-button {
            padding: 12px 20px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .location-button:hover {
            background: #146c43;
        }

        .status {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f1f3f5;
            color: #333;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .map-header {
                padding: 15px;
            }

            .map-header h1 {
                font-size: 20px;
            }

            .map-container {
                padding: 10px;
            }

            .map-card {
                padding: 10px;
            }

            #map {
                height: 500px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Header -->
        <div class="map-header">

            <h1>
                Khidmat.net Delivery Map
            </h1>

            <p>
                Donation delivery tracking
            </p>

        </div>


        <!-- Map -->
        <div class="map-container">

            <div class="map-card">

                <div id="map"></div>


                <div class="controls">

                    <button class="location-button" onclick="findMyLocation()">
                        📍 Find My Location
                    </button>

                </div>


                <div id="location-status" class="status">
                    Map loaded. Press "Find My Location" to test GPS.
                </div>

            </div>

        </div>

    </div>


    <!-- MapLibre JavaScript -->
    <script type="module">

        import * as maplibregl from
            'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';


        /*
         * Create the map
         *
         * Karachi coordinates:
         * Longitude: 67.0011
         * Latitude: 24.8607
         */

        const map = new maplibregl.Map({

            container: 'map',

            style:
                'https://tiles.openfreemap.org/styles/liberty',

            center: [
                67.0011,
                24.8607
            ],

            zoom: 11

        });


        /*
         * Navigation controls
         */

        map.addControl(
            new maplibregl.NavigationControl(),
            'top-right'
        );


        /*
         * Donor marker
         *
         * This is currently a DEMO location.
         * Later we will get this from Django/PostgreSQL.
         */

        const donorMarker =
            new maplibregl.Marker({
                color: '#198754'
            })
                .setLngLat([
                    67.0011,
                    24.8607
                ])
                .setPopup(

                    new maplibregl.Popup()
                        .setHTML(
                            `
                    <strong>Donor</strong>
                    <br>
                    Donation pickup location
                    `
                        )

                )
                .addTo(map);


        /*
         * Recipient marker
         *
         * This is currently a DEMO location.
         * Later we will get this from Django/PostgreSQL.
         */

        const recipientMarker =
            new maplibregl.Marker({
                color: '#dc3545'
            })
                .setLngLat([
                    67.0800,
                    24.8900
                ])
                .setPopup(

                    new maplibregl.Popup()
                        .setHTML(
                            `
                    <strong>Recipient</strong>
                    <br>
                    Donation delivery location
                    `
                        )

                )
                .addTo(map);


        /*
         * Variable for the user's location marker
         */

        let myLocationMarker = null;


        /*
         * Find user's current GPS location
         */

        window.findMyLocation = function () {

            const status =
                document.getElementById(
                    'location-status'
                );


            /*
             * Check browser support
             */

            if (!navigator.geolocation) {

                status.innerText =
                    '❌ Your browser does not support GPS location.';

                return;
            }


            status.innerText =
                '📡 Getting your location...';


            /*
             * Ask browser for location
             */

            navigator.geolocation.getCurrentPosition(

                function (position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    console.log(
                        'Latitude:',
                        latitude
                    );

                    console.log(
                        'Longitude:',
                        longitude
                    );


                    /*
                     * Move map to current location
                     */

                    map.flyTo({

                        center: [
                            longitude,
                            latitude
                        ],

                        zoom: 16

                    });


                    /*
                     * Remove previous location marker
                     */

                    if (myLocationMarker) {

                        myLocationMarker.remove();

                    }


                    /*
                     * Create current location marker
                     */

                    myLocationMarker =
                        new maplibregl.Marker({
                            color: '#0d6efd'
                        })
                            .setLngLat([
                                longitude,
                                latitude
                            ])
                            .setPopup(

                                new maplibregl.Popup()
                                    .setHTML(
                                        `
                                <strong>📍 You are here</strong>
                                <br>
                                Latitude:
                                ${latitude.toFixed(6)}
                                <br>
                                Longitude:
                                ${longitude.toFixed(6)}
                                `
                                    )

                            )
                            .addTo(map);


                    myLocationMarker
                        .togglePopup();


                    /*
                     * Update status
                     */

                    status.innerText =
                        '✅ Your current location was found.';


                },

                function (error) {

                    console.error(
                        'Location error:',
                        error
                    );


                    if (error.code === 1) {

                        status.innerText =
                            '❌ Location permission was denied.';

                    }

                    else if (error.code === 2) {

                        status.innerText =
                            '❌ Your location could not be determined.';

                    }

                    else if (error.code === 3) {

                        status.innerText =
                            '❌ Location request timed out.';

                    }

                    else {

                        status.innerText =
                            '❌ Unable to get your location.';

                    }

                },

                {
                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 0

                }

            );

        };


    </script>

</body>

</html>
